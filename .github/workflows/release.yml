name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish npm package and GitHub release
    if: github.repository == 'Jeecabs/moron-guard'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/moron-guard
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Check release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"

          if [[ "$package_name" != "moron-guard" ]]; then
            echo "Unexpected package name: $package_name" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi

          echo "name=$package_name" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify package
        run: pnpm verify
      - name: Publish to npm
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ steps.metadata.outputs.name }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${NPM_TOKEN:-}" ]]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          fi

          head_sha="$(git rev-parse HEAD)"
          published_git_head="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" gitHead --json 2>/dev/null | tr -d '\"[:space:]' || true)"
          if [[ -n "$published_git_head" ]]; then
            if [[ "$published_git_head" != "$head_sha" ]]; then
              echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists from commit ${published_git_head}" >&2
              exit 1
            fi
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already published from this commit; skipping."
            exit 0
          fi

          npm_tag="latest"
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            npm_tag="next"
          fi
          npm publish --access public --provenance --tag "$npm_tag"
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists; skipping."
            exit 0
          fi

          flags=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}"
