name: Feature request
description: Suggest a focused improvement or new rule family
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What use case or safety gap needs support?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include expected allow and deny behavior when relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and false-positive risks
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This request does not contain secrets, private paths, or a practical unpublished bypass.
          required: true
